<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7faf8"><title>도윤이 💙 윤아 💛 식단 캘린더</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#263d34;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}main{max-width:900px;margin:auto;padding:26px 16px 60px}.eyebrow{color:#678d77;font-size:11px;font-weight:750;letter-spacing:.1em}h1{font-size:clamp(28px,5.5vw,44px);letter-spacing:-.06em;margin:12px 0 9px;line-height:1.4}header{border-bottom:1px solid #dce9e0;padding:15px 0 22px}header p{color:#82968b;font-size:13px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:22px 0}.stat{background:#e9f2e8;padding:17px 12px;border-radius:13px}.stat small{font-size:11px;color:#6d8574}.stat strong{display:block;font-size:29px;margin-top:5px}.stat strong em{font-style:normal;font-weight:400;font-size:11px;color:#8da28c;margin-left:3px}.panel{background:white;border:1px solid #e0ebe2;border-radius:19px;padding:22px;box-shadow:0 6px 25px #48654b0c}.head{display:flex;justify-content:space-between;gap:9px;align-items:center;flex-wrap:wrap}.monthnav{display:flex;gap:10px;align-items:center}.monthnav strong{font-size:20px;white-space:nowrap}.monthnav button{border:1px solid #e2eee3;background:#f0f6ee;border-radius:8px;color:#51735b;padding:3px 12px;font-size:24px;cursor:pointer}.monthnav button:disabled{opacity:.35;cursor:default}.modes{display:flex;background:#edf4ec;border-radius:10px;padding:4px;gap:4px}.modes button{border:0;background:transparent;border-radius:7px;padding:10px 13px;color:#82948a;font-weight:700;cursor:pointer}.modes button.on{background:white;color:#37684e;box-shadow:0 2px 6px #0001}.legend{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:5px 7px;border-radius:6px;white-space:nowrap}.daily-total{display:block;color:#37684e;font-size:13px;font-weight:800;line-height:1.4;margin-top:5px}.itemdate .daily-total{margin-top:4px}.detail .daily-total{font-size:18px;margin:0 0 12px}.rice{background:#eaf0ff;color:#4d73bb}.side{background:#fff0e7;color:#aa6e49}.soup{background:#e1f5ef;color:#348168}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week span{text-align:center;padding:13px 0;color:#839a8b;font-size:12px;font-weight:700}.week span:first-child{color:#d48d82}.day{border:1px solid #eaf0e9;background:white;min-width:0;min-height:110px;margin:-.5px;padding:7px 5px;text-align:left;cursor:pointer}.day.blank{background:#fafdFA;cursor:default}.day.active{background:#edf6ed;outline:2px solid #93bc9b;outline-offset:-2px;position:relative}.number{color:#546e5e;font-weight:700;font-size:12px}.daytags{margin-top:7px;display:flex;flex-direction:column;gap:4px}.daytags .tag{padding:4px 5px;font-size:10px}.item{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;border-bottom:1px solid #edf1eb;background:white;padding:14px 5px;cursor:pointer}.item.active{background:#f0f8ef}.itemdate{font-weight:750;font-size:12px;width:114px;flex-shrink:0}.itemtags{display:flex;flex:1;flex-wrap:wrap;gap:5px}.chev{font-size:22px;color:#96a89b}.detail{background:#f1f7ef;margin-top:18px;padding:17px;border-radius:12px}.detail h2{font-size:16px;margin:0 0 12px}.detail p{font-size:12px;margin:12px 0 0;color:#708875}.notice{font-size:12px;line-height:1.9;color:#849b8b;margin:21px 3px}footer{text-align:center;color:#8fa592;font-size:12px;padding-top:30px}@media(max-width:600px){main{padding:15px 9px 40px}.stats{gap:5px}.stat{padding:12px 7px}.stat strong{font-size:24px}.stat small{font-size:10px}.panel{padding:14px 8px}.monthnav{gap:5px}.monthnav strong{font-size:16px}.monthnav button{padding:2px 8px}.modes button{padding:8px;font-size:11px}.day{min-height:80px;padding:5px 2px}.daytags .tag{font-size:9px;padding:3px 1px;white-space:normal;justify-content:center}.number{font-size:11px}.day .daily-total{font-size:10px}.item{gap:8px}.itemdate{width:97px;font-size:11px}}
</style></head><body><main><header><div class="eyebrow">OUR LITTLE TABLE · BEBECOOK</div><h1>도윤이 💙 윤아 💛<br>식단 캘린더</h1><p>영양밥 · 영양반찬 · 찬찬국 배송일을 한눈에</p></header><div class="stats" id="stats"></div><section class="panel"><div class="head"><div class="monthnav"><button id="prev" aria-label="이전 달">‹</button><strong id="month"></strong><button id="next" aria-label="다음 달">›</button></div><div class="modes"><button id="cal" class="on">▦ 달력</button><button id="list">☷ 리스트</button></div></div><div class="legend"><span class="tag rice">영양밥</span><span class="tag side">영양반찬</span><span class="tag soup">영양찬찬국</span></div><div id="body"></div><div id="detail" class="detail" hidden></div></section><p class="notice">※ 베베쿡 주문 화면의 세트 수와 배송 예정일을 기준으로 작성했어요. 1세트가 꼭 한 끼 분량을 의미하지는 않아요. 2026년 11월 6일에 확인한 네 가지 정기배송의 현재 표시 일정만 반영했어요. 영양밥은 11월 19일까지, 반찬과 국은 사진에서 확인되는 12월 초까지 표시돼요. 공개 사이트이므로 링크를 아는 누구나 볼 수 있어요.</p><footer>도윤이랑 윤아랑 ♡</footer></main><script>
const meals={};function add(date,type,count){if(!meals[date])meals[date]={rice:0,side:0,soup:0};meals[date][type]+=count}
// Updated from Bebecook's four active-order screenshots (November 6, 2026).
// Separate rice subscriptions can deliver on the same day: add their sets.
[[6,2],[9,1],[10,1],[11,1]].forEach(([d,n])=>add('2026-11-'+String(d).padStart(2,'0'),'rice',n)); // 09.06 영양밥 (through 11.11)
[[6,1],[7,2],[10,1],[12,2],[13,1],[14,2],[16,1],[17,2],[18,1],[19,2]].forEach(([d,n])=>add('2026-11-'+String(d).padStart(2,'0'),'rice',n)); // 10.03 영양밥 (through 11.19)
[9,11,13,16,18,20,23,25,27,30].forEach(d=>add('2026-11-'+String(d).padStart(2,'0'),'side',1));
[2,4].forEach(d=>add('2026-12-'+String(d).padStart(2,'0'),'side',1));
[13,14,20,21,27,28].forEach(d=>add('2026-11-'+d,'soup',2));
[4,5].forEach(d=>add('2026-12-'+String(d).padStart(2,'0'),'soup',2));
const names={rice:'영양밥',side:'영양반찬',soup:'찬찬국'},short={rice:'밥',side:'반찬',soup:'국'};
let month=11,mode='cal',selected=null;
function dailyTotal(x){return x?x.rice+x.side+x.soup:0}
function totalLabel(x){return '<span class="daily-total">총 '+dailyTotal(x)+'세트</span>'}
function labelTags(x,small){return Object.keys(names).filter(k=>x[k]).map(k=>'<span class="tag '+k+'">'+(small?short[k]:names[k])+' '+x[k]+'</span>').join('')}
function render(){const prefix='2026-'+String(month).padStart(2,'0')+'-',rows=Object.keys(meals).filter(x=>x.startsWith(prefix)).sort();const totals={rice:0,side:0,soup:0};rows.forEach(date=>Object.keys(totals).forEach(k=>totals[k]+=meals[date][k]));
document.getElementById('stats').innerHTML=[['영양밥',totals.rice,'세트'],['영양반찬',totals.side,'세트'],['찬찬국',totals.soup,'세트'],['배송일',rows.length,'일']].map(([title,n,u])=>'<div class="stat"><small>'+title+'</small><strong>'+n+'<em>'+u+'</em></strong></div>').join('');
document.getElementById('month').textContent='2026년 '+month+'월';document.getElementById('prev').disabled=month===11;document.getElementById('next').disabled=month===12;
document.getElementById('cal').classList.toggle('on',mode==='cal');document.getElementById('list').classList.toggle('on',mode==='list');let html='';
if(mode==='cal'){html='<div class="week">'+['일','월','화','수','목','금','토'].map(t=>'<span>'+t+'</span>').join('')+'</div><div class="days">';let offset=new Date(2026,month-1,1).getDay(),last=new Date(2026,month,0).getDate();for(let i=0;i<offset;i++)html+='<div class="day blank"></div>';for(let d=1;d<=last;d++){const date=prefix+String(d).padStart(2,'0');html+='<button class="day '+(selected===date?'active':'')+'" data-date="'+date+'"><span class="number">'+d+'</span>'+totalLabel(meals[date])+'<div class="daytags">'+(meals[date]?labelTags(meals[date],true):'')+'</div></button>'}html+='</div>'}
else{html=rows.map(date=>{const d=Number(date.slice(-2)),w=['일','월','화','수','목','금','토'][new Date(2026,month-1,d).getDay()];return '<button class="item '+(selected===date?'active':'')+'" data-date="'+date+'"><span class="itemdate">'+month+'/'+d+' ('+w+')'+totalLabel(meals[date])+'</span><span class="itemtags">'+labelTags(meals[date],false)+'</span><span class="chev">›</span></button>'}).join('')}
document.getElementById('body').innerHTML=html;document.querySelectorAll('[data-date]').forEach(btn=>btn.onclick=()=>{selected=btn.dataset.date;render()});
const detail=document.getElementById('detail');if(selected&&selected.startsWith(prefix)){let x=meals[selected]||{rice:0,side:0,soup:0};detail.hidden=false;detail.innerHTML='<h2>'+month+'월 '+Number(selected.slice(-2))+'일 배송</h2>'+totalLabel(x)+labelTags(x,false)}else detail.hidden=true}
document.getElementById('prev').onclick=()=>{month=11;selected=null;render()};document.getElementById('next').onclick=()=>{month=12;selected=null;render()};document.getElementById('cal').onclick=()=>{mode='cal';render()};document.getElementById('list').onclick=()=>{mode='list';render()};render();
</script></body></html>
